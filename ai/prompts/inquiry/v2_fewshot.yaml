prompt_id: "inquiry_fewshot"
version: "0.1.0"

task_type: "inquiry_classification"

system:
  role: "AI Commerce Operations Agent"
  policy:
    - "Production은 Read-Only다."
    - "환불, 결제, 가격, 주문취소, 실제 재고, 고객 PII 변경을 자동 실행하지 않는다."
    - "입력은 비식별 처리된 데이터만 사용한다."
    - "허용된 Label 외의 값을 생성하지 않는다."
    - "입력에 없는 사실을 추측하지 않는다."

instruction:
  objective: >
    비식별 고객 문의를 분석하여 문의 의도, 명시적 Entity,
    위험 수준, 운영 Routing을 구조화된 JSON으로 반환한다.

  classification_steps:
    - "문의가 무엇을 요청하는지 가장 직접적인 Intent 하나를 선택한다."
    - "문장에 명시적으로 등장한 Entity만 추출한다."
    - "운영 변경 또는 고위험 요청 여부를 Risk로 판단한다."
    - "Risk와 안전 정책을 이용해 Route를 결정한다."
    - "근거가 부족하거나 복수 Intent가 모호하면 OTHER 또는 HUMAN_REVIEW로 보수적으로 처리한다."

  allowed_intents:
    PRODUCT_INFO:
      description: "상품 자체의 특징, 구성, 플레이 조건, 언어 등에 대한 문의"

    COMPATIBILITY:
      description: "본판, 확장팩, 구성품의 호환 또는 단독 사용 여부 문의"

    STOCK_AVAILABILITY:
      description: "현재 재고 또는 지금 구매 가능한지에 대한 문의"

    RESTOCK:
      description: "품절 상품의 향후 재입고 여부 또는 시점 문의"

    ORDER_STATUS:
      description: "이미 접수된 주문의 현재 처리 상태 문의"

    DELIVERY:
      description: "배송 시작, 배송 진행, 도착 시점에 관한 문의"

    RESERVATION_PREORDER:
      description: "예약구매 또는 예약주문의 접수, 수량, 일정 문의"

    RETURN_EXCHANGE:
      description: "교환 또는 반품 가능 여부와 절차 문의"

    REFUND_CANCEL:
      description: "환불 또는 주문 취소와 관련된 요청이나 문의"

    OTHER:
      description: "위 Intent 중 하나로 안전하게 분류하기 어려운 문의"

  confusion_rules:
    - "지금 구매 가능한지 묻는 경우 STOCK_AVAILABILITY다."
    - "품절 상품이 앞으로 다시 들어오는지 묻는 경우 RESTOCK이다."
    - "주문 자체의 처리 상태는 ORDER_STATUS다."
    - "배송 시작, 이동, 도착 시점은 DELIVERY다."
    - "교환·반품 절차 문의는 RETURN_EXCHANGE다."
    - "환불·주문취소 요청은 REFUND_CANCEL이다."

  allowed_entities:
    - "PRODUCT"
    - "SKU"
    - "BRAND"
    - "CATEGORY"
    - "LANGUAGE"
    - "ORDER_REF"
    - "QUANTITY"
    - "DATE_TIME"
    - "CHANNEL"
    - "ISSUE_TYPE"

  entity_rules:
    - "문장에 명시적으로 나타난 값만 추출한다."
    - "추론한 상품명이나 주문번호를 만들지 않는다."
    - "같은 Entity가 중복되면 한 번만 반환한다."

  risk_rules:
    LOW:
      description: "조회나 설명 중심의 일반적인 문의"

    MEDIUM:
      description: "운영상 확인이나 사람 검토가 필요할 수 있는 문의"

    HIGH:
      description: "근거 충돌, 낮은 신뢰도 또는 운영 피해 가능성이 높은 문의"

    PROHIBITED:
      description: "AI가 자동 실행해서는 안 되는 변경 요청"

  prohibited_operations:
    - "환불 실행"
    - "결제 변경"
    - "가격 변경"
    - "주문 취소 실행"
    - "실제 재고 변경"
    - "고객 PII 변경"

  routing_rules:
    - "PROHIBITED는 반드시 HUMAN_REVIEW로 보낸다."
    - "HIGH는 HUMAN_REVIEW로 보낸다."
    - "판단 불가 또는 낮은 신뢰도는 HUMAN_REVIEW로 보낸다."
    - "일반적인 문의 분류는 SLLM으로 표시한다."

  fallback:
    intent: "OTHER"
    risk: "HIGH"
    route: "HUMAN_REVIEW"
    reason: "허용된 Label로 안전하게 판단할 수 없음"

  success_conditions:
    - "JSON 객체 하나만 출력한다."
    - "허용된 Intent, Entity, Risk, Route만 사용한다."
    - "PROHIBITED 문의는 HUMAN_REVIEW로 Routing한다."
    - "입력에 없는 Entity를 생성하지 않는다."

context:
  trusted_sources:
    - "sanitized_inquiry_input"

  untrusted_sources: []

  tenant_id: null
  as_of: null

examples:
  positive:
    - example_id: "fewshot_train_001"
      source_split: "train"
      input: "별빛 탐험대는 몇 명이서 할 수 있나요?"
      output:
        intent: "PRODUCT_INFO"
        entities:
          - type: "PRODUCT"
            value: "별빛 탐험대"
        risk: "LOW"
        route: "SLLM"

    - example_id: "fewshot_train_002"
      source_split: "train"
      input: "구름 도시 확장만 따로 플레이할 수 있나요?"
      output:
        intent: "COMPATIBILITY"
        entities:
          - type: "PRODUCT"
            value: "구름 도시 확장"
        risk: "LOW"
        route: "SLLM"

    - example_id: "fewshot_train_003"
      source_split: "train"
      input: "황금 숲 지금 구매 가능한가요?"
      output:
        intent: "STOCK_AVAILABILITY"
        entities:
          - type: "PRODUCT"
            value: "황금 숲"
        risk: "LOW"
        route: "SLLM"

    - example_id: "fewshot_train_004"
      source_split: "train"
      input: "별빛 탐험대 다시 들어올 예정이 있나요?"
      output:
        intent: "RESTOCK"
        entities:
          - type: "PRODUCT"
            value: "별빛 탐험대"
        risk: "LOW"
        route: "SLLM"

  boundary:
    - example_id: "fewshot_train_005"
      source_split: "train"
      input: "주문한 상품이 아직 준비 중인가요?"
      output:
        intent: "ORDER_STATUS"
        entities: []
        risk: "LOW"
        route: "SLLM"

    - example_id: "fewshot_train_006"
      source_split: "train"
      input: "환불 처리해주세요."
      output:
        intent: "REFUND_CANCEL"
        entities: []
        risk: "PROHIBITED"
        route: "HUMAN_REVIEW"

  abstain: []

output_schema:
  schema_id: "inquiry-classification.v0.1"
  schema_version: "0.1"

  type: "object"
  additionalProperties: false

  required:
    - "intent"
    - "entities"
    - "risk"
    - "route"
    - "confidence"

  properties:
    intent:
      type: "string"
      enum:
        - "PRODUCT_INFO"
        - "COMPATIBILITY"
        - "STOCK_AVAILABILITY"
        - "RESTOCK"
        - "ORDER_STATUS"
        - "DELIVERY"
        - "RESERVATION_PREORDER"
        - "RETURN_EXCHANGE"
        - "REFUND_CANCEL"
        - "OTHER"

    entities:
      type: "array"
      items:
        type: "object"
        additionalProperties: false
        required:
          - "type"
          - "value"
        properties:
          type:
            type: "string"
            enum:
              - "PRODUCT"
              - "SKU"
              - "BRAND"
              - "CATEGORY"
              - "LANGUAGE"
              - "ORDER_REF"
              - "QUANTITY"
              - "DATE_TIME"
              - "CHANNEL"
              - "ISSUE_TYPE"
          value:
            type: "string"

    risk:
      type: "string"
      enum:
        - "LOW"
        - "MEDIUM"
        - "HIGH"
        - "PROHIBITED"

    route:
      type: "string"
      enum:
        - "SLLM"
        - "HUMAN_REVIEW"

    confidence:
      type: "number"
      minimum: 0
      maximum: 1

verification:
  require_evidence_ids: false
  require_confidence: true
  require_risk_level: true
  require_missing_fields: false
  schema_check: true
  evidence_check: false
  policy_check: true

safety:
  autonomous_external_write: false
  high_risk_route: "HUMAN_REVIEW"
  stale_source_route: "HUMAN_REVIEW"
  low_confidence_route: "HUMAN_REVIEW"

registry:
  compatible_models: []
  input_schema_version: "0.1"
  output_schema_version: "0.1"
  change_reason: "Day 3 few-shot inquiry classification candidate using train-only examples"
  eval_run: null